nodeLinker: node-modules

# registry.npmjs.org is redirected to 127.0.0.1 by the Jamf-managed blocklist in
# /etc/hosts, so it is unreachable from a managed machine. This is the sanctioned
# mirror, and it is what the other repos on this machine already use.
npmRegistryServer: "https://npm-proxy.dev.databricks.com"
httpRetry: 5
